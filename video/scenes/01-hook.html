<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="p.css">
<script src="anim.js"></script>
<style>
  .row{position:absolute;left:150px;right:150px;top:150px;display:grid;grid-template-columns:1fr 1fr;gap:56px}
  .price{padding:44px 48px;display:grid;gap:14px}
  .price .who{font:700 38px Inter}
  .price .num{font:800 120px Inter;letter-spacing:-3px;line-height:1}
  .price .per{font:500 26px 'JetBrains Mono';color:var(--mute)}
  .price.big .num{color:var(--ink)}
  .price.small{border:2px solid var(--good)}
  .price.small .num{color:var(--good)}
  .acc{position:absolute;left:150px;right:150px;top:640px;text-align:center;font:600 40px Inter}
  .acc b{font-weight:800}
  .acc .sub{display:block;margin-top:12px;font:500 24px 'JetBrains Mono';color:var(--mute)}
  .brand{position:absolute;left:0;right:0;top:830px;text-align:center;font:800 76px Inter;display:flex;justify-content:center;align-items:center;gap:22px}
  .brand small{font:600 34px Inter;color:var(--mute)}
</style></head>
<body>
  <div class="row">
    <div class="card price big" data-cue="this" data-fx="rise" data-dur="0.4">
      <div class="kick">Receipt pipeline today</div>
      <div class="who">Nemotron 3 Ultra <span class="chip warn">thinking on</span></div>
      <div class="num" data-cue="this" data-fx="fade" data-dur="0.4">$3.69</div>
      <div class="per">per 1,000 calls</div>
    </div>
    <div class="card price small" data-cue="nano" data-fx="rise">
      <div class="kick">Same job</div>
      <div class="who">Nemotron 3 Nano <span class="chip">thinking off</span></div>
      <div class="num" data-cue="cents" data-fx="pop">$0.10</div>
      <div class="per">per 1,000 calls</div>
    </div>
  </div>
  <div class="acc" data-cue="accuracy" data-fx="rise">Accuracy on unseen receipts: Ultra <b>92.0%</b> · Nano <b class="g">93.6%</b>
    <span class="sub">86 held-out receipts (CORD v2) · measured on Nebius Token Factory</span></div>
  <div class="brand" data-cue="downshift" data-fx="pop" data-dur="0.7"><svg class="logo" viewBox="0 0 32 32"><rect width="32" height="32" rx="8"/><path d="M9 10h6l8 6-8 6H9l8-6z"/></svg>Downshift
    <small data-cue="proves" data-fx="fade">finds the swap, and proves it</small></div>
</body></html>
